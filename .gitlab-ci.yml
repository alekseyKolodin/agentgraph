# CI agentgraph: typecheck, тесты и сборка web/ на каждый MR и на main; на тег v<версия> — релиз в GitLab с разделом CHANGELOG.md.
# Тег ставит npm run share -- --push, когда версия поднята через npm run release (docs/GETTING_STARTED.md, «Релизы»).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # у ветки с открытым MR хватает MR-пайплайна; ветка без MR пайплайн не запускает
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

default:
  # без тега джоба уходит на shell-раннер; k8s-exec — kubernetes-раннер с образами
  tags: [k8s-exec]
  interruptible: true
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure]

stages: [test, release]

test:
  stage: test
  image: node:24
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  variables:
    GIT_DEPTH: 1
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run typecheck
    - npm test
    # UI (web/): сборка Vite в dist/web, ловит то, чего не видит tsc (CSS, импорты, рантайм-импорт из src/)
    - npm run build:web

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    GIT_DEPTH: 1
  script:
    # раздел «## <версия> — <дата>» без заголовка, до следующего «## »
    - awk -v v="${CI_COMMIT_TAG#v}" '/^## / { if (f) exit; f = ($2 == v); next } f' CHANGELOG.md > notes.md
    - test -s notes.md || { echo "В CHANGELOG.md нет раздела ${CI_COMMIT_TAG#v}"; exit 1; }
  release:
    tag_name: $CI_COMMIT_TAG
    name: agentgraph $CI_COMMIT_TAG
    description: ./notes.md
