# Пример: связка flow. Блок triage решает, что делать с задачей, и заканчивает вывод маркером; next ведёт к вызову
# example-parallel (разбор идеи) или example-blocks (слоган). Каждая итерация блока-вызова — отдельный запуск вызываемого
# flow со ссылкой на этот; его итог приходит сюда в {{prev}} и {{phases.<блок>}}. Слоган повторяется, пока судья не одобрит:
# замечания уходят в задачу следующего вызова через {{feedback}}. Без инструментов, стоит центы:
# npm run agentgraph -- run example-compose -v
name: example-compose
description: "Связка flow: развилка по маркеру → вызов example-parallel или вызов example-blocks до одобрения судьи."
input: Кофейня у станции метро, которая открывается в 6 утра.
blocks:
  - name: triage
    title: Что делать с задачей
    phases:
      - name: decide
        title: Развилка
        tools: []
        model: claude-haiku-4-5-20251001
        max_turns: 1
        prompt: |
          Отвечай сразу текстом из головы: ничего не изучай, инструменты не вызывай.

          Задача: {{input}}

          Если это идея продукта или фичи, которую стоит разобрать с разных сторон, последней строкой выведи <IDEA>.
          Если это описание места или бренда, которому нужен слоган, последней строкой выведи <SLOGAN>.
          Над маркером — одна фраза, почему.
    next:
      - if: { type: marker, marker: "<IDEA>" }
        goto: review
      - goto: slogan

  - name: review
    title: Разбор идеи
    flow: example-parallel
    input: "{{input}}"
    next: end

  - name: slogan
    title: Слоган до одобрения
    flow: example-blocks
    input: |
      {{input}}

      Замечания к прошлому варианту (пусто на первой итерации): {{feedback}}
    loop:
      max_iterations: 2
      until:
        type: judge
        prompt: |
          Задача: {{input}}

          Итог вызванного flow — сверка слогана, перевода и короткой версии:
          {{outputs}}

          Рубрика: done=true, если короткая версия не длиннее 3 слов и годится для вывески. Иначе перечисли в feedback, что не так.
