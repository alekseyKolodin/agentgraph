# Пример: этап сам ставит запуск на паузу маркером loop.pause_marker, когда без решения пользователя дальше нельзя.
# Итерация 1 заканчивается маркером — запуск встаёт на паузу. «Продолжить» — итерация 2 проходит без паузы.
name: example-pause
description: Демонстрация паузы по просьбе агента (loop.pause_marker).
input: Выбрать название для кнопки сохранения.
loop:
  max_iterations: 2
  until:
    type: none
  pause_marker: <NEEDS_USER>
phases:
  - name: decide
    title: Решение или вопрос пользователю
    tools: []
    model: claude-haiku-4-5-20251001
    max_turns: 2
    prompt: |
      Задача: {{input}}
      Это итерация {{iteration}}.

      Если это итерация 1: напиши одну строку с вопросом «Сохранить или Применить?», а следующей
      и последней строкой ответа выведи ровно <NEEDS_USER> — больше ничего после неё.
      Если это итерация 2: выведи одну строку «Название: Сохранить» и ничего больше.
