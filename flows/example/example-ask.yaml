# Пример: этап задаёт вопрос пользователю через AskUserQuestion и ждёт ответа (в UI появляется карточка вопроса).
name: example-ask
description: Демонстрация вопроса от агента и ответа пользователя.
input: Подобрать цвет для кнопки.
loop:
  max_iterations: 1
  until:
    type: none
phases:
  - name: clarify
    title: Уточнение у пользователя
    tools: [AskUserQuestion]
    max_turns: 4
    prompt: |
      Задача: {{input}}

      Прежде чем отвечать, обязательно задай пользователю один вопрос через инструмент AskUserQuestion:
      какой стиль он предпочитает (варианты: "Спокойный", "Яркий", "Контрастный"). Дождись ответа.
      Затем предложи один конкретный HEX-цвет под выбранный стиль.
    handoff: 'одна строка вида COLOR=#RRGGBB — стиль'
