# Пример: параллельная группа (group). Этапы pros, cons и risks идут одновременно и видят один {{prev}} — вывод idea.
# Этап summary получает в {{prev}} склейку их выводов в порядке объявления. Без инструментов, стоит центы.
name: example-parallel
description: Демонстрация параллельных этапов (group) — три независимых взгляда на идею и сводка.
input: Добавить в приложение тёмную тему.
loop:
  max_iterations: 2
  until:
    type: marker
    marker: <DONE>
    phase: summary
phases:
  - name: idea
    title: Идея
    tools: []
    model: claude-haiku-4-5-20251001
    max_turns: 2
    prompt: |
      Отвечай сразу текстом из головы: ничего не изучай, файлы не читай, инструменты и агентов не вызывай.

      Задача: {{input}}

      Опиши идею в двух-трёх предложениях: что меняется для пользователя.
  - name: pros
    title: Плюсы
    group: views
    tools: []
    model: claude-haiku-4-5-20251001
    max_turns: 2
    prompt: |
      Отвечай сразу текстом из головы: ничего не изучай, файлы не читай, инструменты и агентов не вызывай.

      Задача: {{input}}

      Идея:
      {{prev}}

      Назови три плюса идеи, по строке на каждый.
  - name: cons
    title: Минусы
    group: views
    tools: []
    model: claude-haiku-4-5-20251001
    max_turns: 2
    prompt: |
      Отвечай сразу текстом из головы: ничего не изучай, файлы не читай, инструменты и агентов не вызывай.

      Задача: {{input}}

      Идея:
      {{prev}}

      Назови три минуса идеи, по строке на каждый.
  - name: risks
    title: Риски
    group: views
    tools: []
    model: claude-haiku-4-5-20251001
    max_turns: 2
    prompt: |
      Отвечай сразу текстом из головы: ничего не изучай, файлы не читай, инструменты и агентов не вызывай.

      Задача: {{input}}

      Идея:
      {{prev}}

      Назови два риска внедрения, по строке на каждый.
  - name: summary
    title: Сводка
    tools: []
    model: claude-haiku-4-5-20251001
    max_turns: 2
    prompt: |
      Отвечай сразу текстом из головы: ничего не изучай, файлы не читай, инструменты и агентов не вызывай.

      Задача: {{input}}

      Три взгляда на идею (плюсы, минусы, риски):
      {{prev}}

      Сведи их в вердикт из двух-трёх предложений: делать или нет и почему.
      Последней строкой ответа выведи ровно <DONE>.
