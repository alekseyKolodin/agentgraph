# Пример: артефакты запуска. Файл идей переживает итерации: каждая итерация дописывает в него две идеи,
# этап выбора только читает его. Этапам не нужны инструменты проекта: writes даёт правку только своего артефакта.
# Между итерациями файл можно поправить в UI (или руками) — следующая итерация увидит правку.
name: example-artifacts
description: "Демонстрация артефактов: файл идей переживает итерации, этапы пишут только свои артефакты."
input: Название для приложения заметок, которое работает без интернета.
defaults:
  model: claude-haiku-5-5
artifacts:
  ideas:
    title: Идеи
    initial: |
      # Идеи
  decisions:
    title: Решения
    decisions: true
loop:
  max_iterations: 2
  until:
    type: none
phases:
  - name: brainstorm
    title: Ещё две идеи
    tools: []
    reads: [decisions]
    writes: [ideas]
    max_turns: 6
    prompt: |
      Задача: {{input}}
      Итерация {{iteration}} из {{max_iterations}}.

      Сейчас в файле идей:
      {{artifacts.ideas}}

      Решения пользователя (может быть пусто — тогда решений нет):
      {{artifacts.decisions}}

      Допиши в конец файла {{artifacts.ideas.path}} две новые идеи, которых там ещё нет, — каждую отдельной
      строкой вида «- Название: почему подходит». Остальной текст файла не меняй.
    handoff: одна строка — какие две идеи добавил
  - name: pick
    title: Выбор лучшей
    tools: []
    reads: [ideas]
    max_turns: 5
    prompt: |
      Задача: {{input}}

      Все идеи:
      {{artifacts.ideas}}

      Выбери одну лучшую идею. Ответь одной строкой: «Выбор: <название> — <почему>».
