# Пример: несколько блоков подряд — цикл до одобрения судьи, затем шаги в один проход, затем ещё один цикл.
# Без инструментов, стоит центы. {{prev}} и {{phases.NAME}} переходят из блока в блок, {{feedback}} и {{iteration}} у каждого блока свои.
name: example-blocks
description: "Демонстрация блоков: слоган до одобрения судьи → варианты в один проход → правка и сверка до маркера."
input: Слоган для кофейни у станции метро, которая открывается в 6 утра.
blocks:
  - name: slogan
    title: Слоган до одобрения судьи
    loop:
      max_iterations: 3
      until:
        type: judge
        prompt: |
          Задача: {{input}}

          Вывод этапа:
          {{outputs}}

          Рубрика: done=true, только если слоган один, не длиннее 7 слов, на русском и явно отсылает к раннему открытию.
          Иначе перечисли в feedback, что не так.
    phases:
      - name: write
        title: Слоган
        tools: []
        max_turns: 1
        prompt: |
          Задача: {{input}}

          Если ниже есть замечания с прошлой итерации, учти их: {{feedback}}

          Придумай один слоган.
        handoff: одна строка — только слоган, без кавычек и пояснений

  - name: variants
    title: Варианты (один проход)
    phases:
      - name: translate
        title: Перевод
        tools: []
        max_turns: 1
        prompt: |
          Переведи слоган на английский, сохранив игру слов, если она есть:
          {{prev}}
        handoff: одна строка — только перевод
      - name: short
        title: Короткая версия
        tools: []
        max_turns: 1
        prompt: |
          Сократи слоган до 3 слов для вывески:
          {{phases.write}}
        handoff: одна строка — только короткая версия

  - name: review
    title: Сверка и правка
    loop:
      max_iterations: 3
      until:
        type: marker
        marker: <DONE>
    phases:
      - name: fix
        title: Правка короткой версии
        tools: []
        max_turns: 1
        prompt: |
          Слоган: {{phases.write}}
          Исходная короткая версия: {{phases.short}}
          Твоя правка с прошлой итерации (пусто на первой): {{phases.fix}}
          Замечания сверки к ней (пусто на первой): {{phases.check}}

          На первой итерации верни исходную короткую версию как есть. Дальше исправь её по замечаниям: до 3 слов, смысл слогана сохранён.
        handoff: одна строка — только короткая версия
      - name: check
        title: Сверка
        tools: []
        max_turns: 1
        prompt: |
          Задача: {{input}}

          Слоган: {{phases.write}}
          Перевод: {{phases.translate}}
          Короткая версия: {{prev}}

          Проверь, что перевод и короткая версия передают смысл слогана. Сверяй смысл, а не дословность: короткая версия может опускать детали.
          Перечисли три варианта списком. Если всё согласовано, последней строкой выведи <DONE>; иначе кратко опиши, что исправить в короткой версии.
