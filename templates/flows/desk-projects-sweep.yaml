# Готовый flow «Мои дела» (docs/desk/SPEC.md, этап 4.6): обход проекта — забытое в рабочей папке. Рутина «Каждое утро
# → обход проекта» (расписание, task.from: flow) запускает его в папке проекта; находки заводит делами
# инструментом desk_put (вид «Забытое»). Закрывает такие дела сверка: наблюдатель ветки видит, что стало чисто.
name: desk-projects-sweep
description: Обход проекта — незакоммиченное и ветки впереди без MR; находки — делами «Забытое» через desk_put.
input: Обойди проект и заведи делами то, что я забыл.
loop:
  max_iterations: 1
  until:
    type: none
phases:
  - name: sweep
    title: Обход
    tools: [Bash]
    max_turns: 50
    prompt: |
      {{input}}

      Ты в рабочей папке проекта. Найди, что пользователь начал и бросил, и заведи это делами. Ничего не меняй:
      не коммить, не удаляй ветки, не переключай ветку, не трогай stash.

      1. Корень репозитория для ключей дел — основной checkout, даже если ты в worktree:
         `ROOT=$(cd "$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")" && pwd -P)`.
         Ключ ветки — `branch:$ROOT#<ветка>`, ровно так.
      2. Основная ветка: `git symbolic-ref --short refs/remotes/origin/HEAD` (без `origin/`), нет — main или master.
      3. Незакоммиченное: `git worktree list --porcelain` и для каждой папки `git -C <папка> status --short`.
      4. Ветки впереди без MR: `git for-each-ref --format='%(refname:short) %(upstream:short) %(upstream:track) %(committerdate:short)' refs/heads`;
         пропусти основную ветку и слитые в неё (`git branch --merged <основная>`). Для остальных с коммитами
         впереди upstream или без upstream проверь MR/PR: `glab mr list --source-branch <ветка>` (GitLab) или
         `gh pr list --head <ветка>` (GitHub). Нет доступа — считай, что MR неизвестен, и так и напиши в why.
      5. Заведи desk_put по одному делу на находку, kind: «Забытое», thing: ключ ветки из шага 1:
         - грязная папка — title: «Не закоммичено в <ветка>: N файлов»;
         - ветка впереди без MR — title: «<ветка>: N коммитов без MR»;
         - why: одной строкой, давно ли (дата последнего коммита).
         Повторный вызов с той же вещью только дописывает сигнал — дублей не будет.
    handoff: Итог — список заведённых дел одной строкой на дело, или «Забытого нет».
