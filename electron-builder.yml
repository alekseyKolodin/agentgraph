# Упаковка десктопного приложения: npm run desktop:build -> release/desktop/ (docs/GETTING_STARTED.md, «Десктопное приложение»).
# Главный процесс — dist/desktop/main.js (tsc из src/desktop/main.ts), сервер — dist/*.js, UI — dist/web (vite).
# node_modules — только dependencies из package.json: devDependencies (React, Vite, Electron) в приложение не попадают.
appId: dev.agentgraph.desktop
productName: agentgraph
directories:
  output: release/desktop
files:
  - package.json
  - dist/**/*
  - "!dist/**/*.map"
  - "!dist/**/*.test.js"
  # node-pty (терминал вкладки «Сессии»): исходники и сборки под Windows (~60 МБ) приложению под macOS не нужны
  - "!node_modules/node-pty/prebuilds/win32-*"
  - "!node_modules/node-pty/{deps,src,third_party,scripts}"
# Agent SDK запускает CLI Claude Code — нативный бинарник из пакета под платформу — дочерним процессом.
# Изнутри app.asar exec невозможен: пакет лежит рядом, в app.asar.unpacked.
# node-pty — нативный модуль терминала: pty.node и spawn-helper тоже запускаются только снаружи asar
# (путь к spawn-helper node-pty сам переписывает на app.asar.unpacked).
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
  - node_modules/node-pty/**
# пересобирать под Electron нечего: node-pty 1.1.0 — N-API со сборками под darwin-arm64 и darwin-x64 в пакете
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  # бинарник Claude Code — под одну архитектуру (пакет SDK ставится под машину сборки), поэтому без universal и x64
  target:
    - dmg
    - zip
