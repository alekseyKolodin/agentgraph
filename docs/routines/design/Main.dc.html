<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Рутины — список</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#111316}
a{color:#e7e9ec;text-decoration:none}a:hover{color:#ffffff}
.ag{--deck:#111316;--panel:#181b20;--raised:#1f232a;--well:#0c0e11;--hover:rgba(255,255,255,.04);--select:rgba(255,255,255,.07);--line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.14);--ink:#e7e9ec;--ink-2:#a3a9b3;--ink-3:#7d848e;--ink-off:#4b515a;--live:#7aa7ff;--ok:#4cc38a;--fail:#f06a6a;--wait:#f2b136;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;color:var(--ink);background:var(--deck);-webkit-font-smoothing:antialiased}
.ag *{box-sizing:border-box}
.btn{font-family:inherit;font-size:13px;font-weight:500;line-height:20px;color:var(--ink);background:var(--raised);border:1px solid var(--line-strong);border-radius:6px;padding:5px 12px;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:32px;transition:background-color .12s,border-color .12s}
.btn:hover{background:#262b33;color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.sw:focus-visible,a:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(122,167,255,.55)}
.btn.p{background:#e7e9ec;color:#111316;border-color:#e7e9ec}
.btn.p:hover{background:#ffffff;color:#111316}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tk{width:5px;height:14px;border-radius:1px;display:block}
.tk.o{background:var(--ok)}.tk.f{background:var(--fail)}.tk.w{background:var(--wait)}.tk.l{background:var(--live)}.tk.s{background:var(--ink-off);height:5px}.tk.c{border:1px solid var(--ink-off)}
.rail{flex:0 0 48px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0}
.ri{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;color:var(--ink-3);position:relative}
.ri:hover{background:var(--hover);color:var(--ink)}
.ri.on{background:var(--select);color:var(--ink)}
.ri .b{position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--wait)}
.rsep{width:20px;height:1px;background:var(--line);margin:4px 0}
.rrow{display:grid;grid-template-columns:10px minmax(0,1fr) auto 44px;gap:16px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line)}
.rrow:hover{background:var(--hover)}
.sw{width:34px;height:20px;border-radius:999px;position:relative;cursor:pointer;padding:0}
@media (max-width:700px){.rail{flex-basis:100%;flex-direction:row;flex-wrap:wrap;padding:4px 8px;border-right:0;border-bottom:1px solid var(--line)}.rsep{width:1px;height:20px;margin:0 4px}.strip{display:none !important}.rrow{grid-template-columns:10px minmax(0,1fr) 44px}}
</style>
</helmet>
<div class="ag" style="min-height: 600px; display: flex; flex-wrap: wrap; align-items: stretch">
  <nav class="rail" aria-label="Разделы">
    <a class="ri" href="Home.dc.html" aria-label="Главная" title="Главная"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5 9 3.5l6 5V15h-4v-4H7v4H3z"/></svg><span class="b"></span></a>
    <a class="ri" href="#" aria-label="Быстрая сессия" title="Быстрая сессия"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M9 4v10M4 9h10"/></svg></a>
    <span class="rsep"></span>
    <a class="ri" href="#" aria-label="Flow" title="Flow"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="4.5" cy="4.5" r="2"/><circle cx="13.5" cy="13.5" r="2"/><path d="M6.5 4.5h3a2 2 0 0 1 2 2v5"/></svg></a>
    <a class="ri" href="#" aria-label="Запуски" title="Запуски"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M5 3.5v11l9-5.5z"/></svg></a>
    <a class="ri" href="#" aria-label="Сессии" title="Сессии"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3.5" width="13" height="11" rx="2"/><path d="m5.5 7.5 2 1.5-2 1.5M9.5 11h3"/></svg></a>
    <span class="rsep"></span>
    <a class="ri" href="#" aria-label="Пространства" title="Пространства"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5 15.5 9 9 15.5 2.5 9z"/></svg></a>
    <a class="ri" href="#" aria-label="Знания" title="Знания"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M7 3 5.5 15M12.5 3 11 15M3.5 6.5h12M3 11.5h12"/></svg></a>
    <a class="ri" href="#" aria-label="Teamwork" title="Teamwork"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="12.5" cy="7.5" r="2"/><path d="M2.5 15c0-2.5 1.8-4 4-4s4 1.5 4 4M11 11.2c2.3-.3 4.5 1 4.5 3.8"/></svg></a>
    <a class="ri" href="#" aria-label="Код" title="Код"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 5-4 4 4 4M11.5 5l4 4-4 4"/></svg></a>
    <a class="ri on" href="Main.dc.html" aria-label="Рутины" title="Рутины" aria-current="page"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M10 2 4 10h4.5L7.5 16 14 8H9.5z"/></svg></a>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; padding: 24px 28px 32px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.005em">Рутины</h1>
        <span class="mono" style="font-size: 12px; color: var(--ink-2)">сегодня 3 запуска · $2.40 из $10</span>
      </div>
      <span style="flex: 1"></span>
      <a class="btn" href="New.dc.html">Новая рутина</a>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(242,177,54,.45); background: color-mix(in srgb, #f2b136 6%, #181b20)">
      <span class="dot" style="background: var(--wait)"></span>
      <span style="font-weight: 500">Таска AG-447 ждёт твоего решения</span>
      <span style="font-size: 13px; color: var(--ink-2)">Баг в #bugs · 12 мин</span>
      <span style="flex: 1"></span>
      <a class="btn p" href="Home.dc.html">Открыть</a>
    </div>

    <div style="border-top: 1px solid var(--line)">
      <sc-for list="{{rules}}" as="r" hint-placeholder-count="5">
        <div class="rrow">
          <span class="dot" style="{{r.dotStyle}}"></span>
          <div style="min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <a href="{{r.href}}" style="{{r.nameStyle}}">{{r.name}}</a>
            <span style="font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.sent}}</span>
          </div>
          <div class="strip" style="display: flex; gap: 2px; align-items: center" title="{{r.stripTitle}}">
            <sc-for list="{{r.strip}}" as="t" hint-placeholder-count="14"><span class="tk {{t}}"></span></sc-for>
          </div>
          <button type="button" class="sw" role="switch" aria-checked="{{r.onStr}}" aria-label="{{r.swLabel}}" onClick="{{r.toggle}}" style="{{r.swStyle}}"><span style="{{r.knobStyle}}"></span></button>
        </div>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":600}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { off: { tg: true } };
  }
  renderVals() {
    const off = this.state.off;
    const base = [
      { id: 'bug', name: 'Баг в #bugs → таска и фикс', sent: 'Slack · #bugs → bug-to-fix', strip: 'sossofsossosow', dot: 'wait', href: 'Editor.dc.html' },
      { id: 'mr', name: 'MR на ревью → замечания', sent: 'GitLab · меня назначили ревьюером → review-only', strip: 'oooosooooosool', dot: 'live', href: 'Log.dc.html' },
      { id: 'ff', name: 'Встреча закончилась → задачи и итог', sent: 'Fireflies.ai · расшифровка готова → meeting-to-tasks', strip: 'ooosoooosooooo', dot: 'ok', href: 'Editor.dc.html' },
      { id: 'digest', name: 'Утренняя сводка по MR', sent: 'Расписание · будни, 9:30 → mr-digest', strip: 'ooooofoooo', dot: 'ok', href: 'Editor.dc.html' },
      { id: 'tg', name: 'Заметка боту → в пространство', sent: 'Telegram · личные сообщения боту → note-to-space', strip: 'ooo', dot: 'ok', href: 'Editor.dc.html' }
    ];
    const dots = { wait: 'background: var(--wait)', live: 'background: var(--live)', ok: 'background: var(--ok)' };
    const rules = base.map((r) => {
      const paused = Boolean(off[r.id]);
      const strip = (r.strip + 'c'.repeat(14)).slice(0, 14).split('');
      const runs = strip.filter((t) => t !== 's' && t !== 'c').length;
      const skips = strip.filter((t) => t === 's').length;
      return {
        name: r.name,
        href: r.href,
        sent: paused ? r.sent + ' · на паузе' : r.sent,
        strip,
        stripTitle: 'Последние события: ' + runs + ' запусков, ' + skips + ' пропущено',
        dotStyle: paused ? 'border: 1.4px solid var(--ink-3)' : dots[r.dot],
        nameStyle: 'font-weight: 500; color: ' + (paused ? 'var(--ink-3)' : 'var(--ink)'),
        onStr: paused ? 'false' : 'true',
        swLabel: (paused ? 'Включить «' : 'Поставить на паузу «') + r.name + '»',
        swStyle: paused
          ? 'background: var(--raised); border: 1px solid var(--line-strong)'
          : 'background: color-mix(in srgb, #4cc38a 30%, #1f232a); border: 1px solid rgba(76,195,138,.5)',
        knobStyle: 'position: absolute; top: 3px; width: 12px; height: 12px; border-radius: 50%; transition: left .12s; left: ' + (paused ? '3px' : '17px') + '; background: ' + (paused ? 'var(--ink-3)' : 'var(--ink)'),
        toggle: () => this.setState({ off: Object.assign({}, off, { [r.id]: !paused }) })
      };
    });
    return { rules };
  }
}
</script>
</body>
</html>
